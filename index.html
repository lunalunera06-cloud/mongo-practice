<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | Café y Aroma</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #2f241f; }
        form { display: grid; gap: 12px; max-width: 420px; }
        input, button { padding: 10px; font: inherit; }
        button { cursor: pointer; background: #6f442d; color: white; border: 0; }
        li { display: flex; justify-content: space-between; gap: 20px; padding: 10px 0; border-bottom: 1px solid #ddd; }
        .error { color: #a32626; }
    </style>
</head>
<body>
    <h1>Clientes interesados</h1>

    <form id="clienteForm">
        <input name="nombre" placeholder="Nombre" required>
        <input name="correo" type="email" placeholder="Correo" required>
        <input name="productoInteres" placeholder="Producto de interés" required>
        <button type="submit">Guardar cliente</button>
        <p id="mensaje" role="status"></p>
    </form>

    <h2>Registros guardados</h2>
    <ul id="listaClientes"></ul>

    <script>
        const formulario = document.querySelector('#clienteForm');
        const lista = document.querySelector('#listaClientes');
        const mensaje = document.querySelector('#mensaje');

        const cargarClientes = async () => {
            const respuesta = await fetch('/api/clientes');
            const clientes = await respuesta.json();

            lista.innerHTML = clientes.map((cliente) => `
                <li>
                    <span>${cliente.nombre} - ${cliente.correo} - ${cliente.productoInteres}</span>
                    <button type="button" data-id="${cliente._id}">Eliminar</button>
                </li>
            `).join('');
        };

        formulario.addEventListener('submit', async (event) => {
            event.preventDefault();
            const datos = Object.fromEntries(new FormData(formulario));
            const respuesta = await fetch('/api/clientes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            const resultado = await respuesta.json();
            mensaje.textContent = respuesta.ok ? 'Cliente guardado.' : resultado.error;
            mensaje.className = respuesta.ok ? '' : 'error';

            if (respuesta.ok) {
                formulario.reset();
                cargarClientes();
            }
        });

        lista.addEventListener('click', async (event) => {
            if (!event.target.dataset.id) return;

            await fetch(`/api/clientes/${event.target.dataset.id}`, { method: 'DELETE' });
            cargarClientes();
        });

        cargarClientes();
    </script>
</body>
</html>
